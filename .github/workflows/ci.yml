name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NEXT_PUBLIC_SITE_URL: https://darkcardcollection.com
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nessun input version: la versione pnpm arriva dal campo
      # packageManager di package.json (11.x). Specificare entrambi
      # fa fallire pnpm/action-setup@v4 all'istante.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency audit
        run: pnpm audit --prod

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm exec next build
